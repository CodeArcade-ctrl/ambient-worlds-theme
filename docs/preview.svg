<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Ambient Worlds theme previews</title>
  <desc id="desc">Three dashboard palette mockups: Coastal Light, Desert Observatory, and Midnight Library.</desc>
  <defs>
    <linearGradient id="coast" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f1ec"/><stop offset=".53" stop-color="#e4edf4"/><stop offset="1" stop-color="#f5ecdf"/></linearGradient>
    <linearGradient id="desert" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e4c9"/><stop offset=".53" stop-color="#f1e1d5"/><stop offset="1" stop-color="#e8e3e2"/></linearGradient>
    <linearGradient id="library" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f0e7d7"/><stop offset=".53" stop-color="#eae3df"/><stop offset="1" stop-color="#e3e0e9"/></linearGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="#f5f6f7"/>
  <g font-family="Arial,sans-serif">

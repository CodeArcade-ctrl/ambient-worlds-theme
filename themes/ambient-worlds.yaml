Coastal Light:
  primary-color: "#397d84"
  accent-color: "#d18b60"
  ha-card-border-radius: "20px"
  ha-card-box-shadow: "0 8px 28px rgba(38, 69, 75, 0.10)"
  modes:
    light:
      primary-background-color: "#eef5f3"
      secondary-background-color: "#e2ecea"
      card-background-color: "rgba(251, 254, 252, 0.88)"
      primary-text-color: "#263b40"
      secondary-text-color: "#587177"
      disabled-text-color: "#8c9b9b"
      divider-color: "rgba(47, 84, 88, 0.13)"
      app-header-background-color: "rgba(245, 250, 248, 0.92)"
      app-header-text-color: "#263b40"
      sidebar-background-color: "rgba(239, 247, 245, 0.95)"
      sidebar-text-color: "#3b555a"
      sidebar-selected-background-color: "rgba(57, 125, 132, 0.15)"
      lovelace-background: "radial-gradient(ellipse at 13% 9%, rgba(124, 190, 178, 0.45) 0%, transparent 40%), radial-gradient(ellipse at 88% 13%, rgba(242, 198, 145, 0.42) 0%, transparent 38%), linear-gradient(145deg, #e6f2ee 0%, #e7f0f5 54%, #f5eee3 100%)"
      ha-card-backdrop-filter: "blur(12px)"
      state-active-color: "#397d84"
      state-unavailable-color: "#8c9b9b"
    dark:
      primary-background-color: "#152327"
      secondary-background-color: "#1c2d32"
      card-background-color: "rgba(32, 50, 55, 0.90)"
      primary-text-color: "#e7f0ed"
      secondary-text-color: "#b3c7c4"
      disabled-text-color: "#758a8b"
      divider-color: "rgba(198, 221, 216, 0.13)"
      app-header-background-color: "rgba(22, 37, 42, 0.95)"
      app-header-text-color: "#e7f0ed"
      sidebar-background-color: "rgba(19, 33, 38, 0.97)"
      sidebar-text-color: "#c7d9d5"
      sidebar-selected-background-color: "rgba(116, 190, 178, 0.19)"
      lovelace-background: "radial-gradient(ellipse at 13% 9%, rgba(47, 119, 108, 0.53) 0%, transparent 40%), radial-gradient(ellipse at 88% 13%, rgba(145, 103, 64, 0.4) 0%, transparent 38%), linear-gradient(145deg, #142226 0%, #1a2a31 54%, #28261f 100%)"
      ha-card-backdrop-filter: "blur(12px)"
      state-active-color: "#82cdbf"
      state-unavailable-color: "#758a8b"

